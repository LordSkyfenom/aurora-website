<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форум - Aurora</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .container-forum { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .post-card { background: #20232b; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .post-title { color: #2ecc2e; margin-bottom: 10px; cursor: pointer; }
        .post-meta { color: #919ba8; font-size: 0.8rem; margin-bottom: 10px; }
        .post-content { color: #cbd0d6; line-height: 1.5; margin-bottom: 15px; }
        .answers { margin-top: 15px; padding-left: 20px; border-left: 2px solid #3d434d; display: none; }
        .answer { background: #1a1d24; padding: 10px; margin: 10px 0; border-radius: 8px; }
        .create-form { background: #20232b; border-radius: 16px; padding: 20px; margin-bottom: 30px; }
        .create-form input, .create-form textarea { width: 100%; padding: 10px; margin: 10px 0; background: #1a1d24; border: 1px solid #3d434d; color: white; border-radius: 8px; }
        .create-form button, .answer-btn { background: #2ecc2e; color: #1a1d24; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2ecc2e; text-decoration: none; }
        .answer-input { width: 100%; padding: 10px; margin: 10px 0; background: #1a1d24; border: 1px solid #3d434d; color: white; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container-forum">
        <a href="/" class="back-link">← На главную</a>
        <h1 style="color:#2ecc2e;">📝 Форум помощи</h1>
       
        <div class="create-form">
            <h3>➕ Создать тему</h3>
            <input type="text" id="postTitle" placeholder="Краткий вопрос">
            <textarea id="postContent" rows="3" placeholder="Подробное описание проблемы..."></textarea>
            <button onclick="createPost()">Опубликовать</button>
        </div>
       
        <div id="postsList"></div>
    </div>
   
    <script>
        let currentUserId = null;
        let openPosts = new Set();
       
        async function checkUser() {
            const res = await fetch('/api/user');
            const data = await res.json();
            if (data.authenticated) {
                currentUserId = data.id;
            }
        }
       
        async function loadPosts() {
            const res = await fetch('/api/forum');
            const posts = await res.json();
            const container = document.getElementById('postsList');
            container.innerHTML = posts.map(p => `
                <div class="post-card">
                    <div class="post-title" onclick="toggleAnswers(${p.id})">
                        ❓ ${escapeHtml(p.title)}
                    </div>
                    <div class="post-meta">✍️ ${escapeHtml(p.authorName)} | 📅 ${new Date(p.createdAt).toLocaleString()}</div>
                    <div class="post-content">${escapeHtml(p.content)}</div>
                    <div id="answers-${p.id}" class="answers" style="display:${openPosts.has(p.id) ? 'block' : 'none'}">
                        <h4>💬 Ответы:</h4>
                        <div id="answers-list-${p.id}">
                            ${(p.answers || []).map(a => `
                                <div class="answer">
                                    <strong>${escapeHtml(a.authorName)}:</strong> ${escapeHtml(a.content)}<br>
                                    <small style="color:#6b7482;">${new Date(a.createdAt).toLocaleString()}</small>
                                </div>
                            `).join('')}
                        </div>
                        <textarea id="answer-input-${p.id}" class="answer-input" rows="2" placeholder="Ваш ответ..."></textarea>
                        <button class="answer-btn" onclick="addAnswer(${p.id})">Ответить</button>
                    </div>
                </div>
            `).join('');
        }
       
        async function createPost() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            if (!title || !content) return alert('Заполните все поля');
           
            const res = await fetch('/api/forum', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content })
            });
            if (res.ok) {
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                loadPosts();
            }
        }
       
        async function addAnswer(postId) {
            const content = document.getElementById(`answer-input-${postId}`).value;
            if (!content) return alert('Введите ответ');
           
            const res = await fetch(`/api/forum/${postId}/answer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            if (res.ok) {
                document.getElementById(`answer-input-${postId}`).value = '';
                loadPosts();
            }
        }
       
        function toggleAnswers(postId) {
            if (openPosts.has(postId)) {
                openPosts.delete(postId);
            } else {
                openPosts.add(postId);
            }
            loadPosts();
        }
       
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
       
        checkUser();
        loadPosts();
    </script>
</body>
</html>
