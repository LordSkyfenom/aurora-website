<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Города - Aurora</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .container-cities { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .city-card { background: #20232b; border-radius: 16px; padding: 20px; margin-bottom: 20px; border-left: 3px solid #2ecc2e; }
        .city-name { color: #2ecc2e; margin-bottom: 10px; }
        .city-meta { color: #919ba8; font-size: 0.8rem; margin-bottom: 10px; }
        .city-description { color: #cbd0d6; line-height: 1.5; }
        .delete-city { background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 8px; cursor: pointer; float: right; }
        .create-form { background: #20232b; border-radius: 16px; padding: 20px; margin-bottom: 30px; }
        .create-form input, .create-form textarea { width: 100%; padding: 10px; margin: 10px 0; background: #1a1d24; border: 1px solid #3d434d; color: white; border-radius: 8px; }
        .create-form button { background: #2ecc2e; color: #1a1d24; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2ecc2e; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container-cities">
        <a href="/" class="back-link">← На главную</a>
        <h1 style="color:#2ecc2e;">🏙️ Города игроков</h1>
       
        <div class="create-form">
            <h3>🏗️ Создать город</h3>
            <input type="text" id="cityName" placeholder="Название города">
            <textarea id="cityDescription" rows="3" placeholder="Описание города"></textarea>
            <button onclick="createCity()">Создать</button>
        </div>
       
        <div id="citiesList"></div>
    </div>
   
    <script>
        let currentUserId = null;
       
        async function checkUser() {
            const res = await fetch('/api/user');
            const data = await res.json();
            if (data.authenticated) {
                currentUserId = data.id;
            }
        }
       
        async function loadCities() {
            const res = await fetch('/api/cities');
            const cities = await res.json();
            const container = document.getElementById('citiesList');
            container.innerHTML = cities.map(c => `
                <div class="city-card">
                    ${currentUserId === c.ownerId ? `<button class="delete-city" onclick="deleteCity(${c.id})">🗑️</button>` : ''}
                    <h3 class="city-name">🏘️ ${escapeHtml(c.name)}</h3>
                    <div class="city-meta">👑 Владелец: ${escapeHtml(c.ownerName)} | 📅 ${new Date(c.createdAt).toLocaleDateString()}</div>
                    <div class="city-description">📝 ${escapeHtml(c.description)}</div>
                </div>
            `).join('');
        }
       
        async function createCity() {
            const name = document.getElementById('cityName').value;
            const description = document.getElementById('cityDescription').value;
            if (!name || !description) return alert('Заполните все поля');
           
            const res = await fetch('/api/cities', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description })
            });
            if (res.ok) {
                document.getElementById('cityName').value = '';
                document.getElementById('cityDescription').value = '';
                loadCities();
            } else {
                alert('Ошибка');
            }
        }
       
        async function deleteCity(id) {
            if (confirm('Удалить город?')) {
                await fetch(`/api/cities/${id}`, { method: 'DELETE' });
                loadCities();
            }
        }
       
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
       
        checkUser();
        loadCities();
    </script>
</body>
</html>
