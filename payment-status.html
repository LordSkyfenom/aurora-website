<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус заказа - Aurora</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .status-container { max-width: 500px; margin: 0 auto; padding: 60px 20px; text-align: center; }
        .order-card { background: #20232b; border-radius: 24px; padding: 32px; border: 1px solid #2ecc2e; }
        .order-id { color: #2ecc2e; font-size: 1.2rem; margin-bottom: 20px; }
        .order-info { margin: 15px 0; color: #cbd0d6; text-align: left; }
        .button-group { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; align-items: center; }
        .btn-confirm, .btn-cancel { width: 200px; padding: 14px 32px; border-radius: 40px; cursor: pointer; font-weight: bold; font-size: 1rem; border: none; }
        .btn-confirm { background: #2ecc2e; color: #1a1d24; }
        .btn-cancel { background: #dc2626; color: white; }
        .btn-confirm:hover { background: #27ae60; transform: scale(1.02); }
        .btn-cancel:hover { background: #b91c1c; transform: scale(1.02); }
        .btn-back { background: #3d434d; color: white; border: none; padding: 12px 32px; border-radius: 40px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 30px; }
        .info-text { color: #919ba8; margin: 20px 0; }
        .warning { color: #fbbf24; margin: 15px 0; font-weight: bold; }
        .status-pending { color: #fbbf24; }
        .status-completed { color: #2ecc2e; }
        .status-cancelled { color: #dc2626; }
    </style>
</head>
<body>
    <div class="status-container">
        <div class="order-card">
            <h1 style="color:#2ecc2e;">💰 Статус заказа</h1>
            <div id="orderInfo">
                <p>Загрузка...</p>
            </div>
            <div id="buttons" class="button-group"></div>
            <a href="/" class="btn-back">← На главную</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        
        if (!orderId) {
            document.getElementById('orderInfo').innerHTML = '<p>❌ Заказ не указан</p>';
        } else {
            loadOrder();
        }
        
        async function loadOrder() {
            try {
                const res = await fetch(`/api/order/${orderId}`);
                const order = await res.json();
                
                if (!order || order.error) {
                    document.getElementById('orderInfo').innerHTML = `<p>❌ ${order.error || 'Заказ не найден'}</p>`;
                    return;
                }
                
                let statusText = '';
                if (order.status === 'pending') statusText = '<span class="status-pending">⏳ Ожидает оплаты</span>';
                else if (order.status === 'awaiting_confirmation') statusText = '<span class="status-pending">⏳ Ожидает подтверждения</span>';
                else if (order.status === 'completed') statusText = '<span class="status-completed">✅ Выполнен</span>';
                else if (order.status === 'cancelled') statusText = '<span class="status-cancelled">❌ Отменён</span>';
                
                document.getElementById('orderInfo').innerHTML = `
                    <div class="order-id">📦 Заказ #${order.id}</div>
                    <div class="order-info">👤 Игрок: <strong>${escapeHtml(order.playerName)}</strong></div>
                    <div class="order-info">📦 Товар: ${order.product}</div>
                    <div class="order-info">💰 Сумма: ${order.price}₽</div>
                    <div class="order-info">📌 Статус: ${statusText}</div>
                    ${order.status === 'pending' ? '<div class="warning">⚠️ После оплаты нажмите "Подтвердить"</div>' : ''}
                `;
                
                const buttonsDiv = document.getElementById('buttons');
                if (order.status === 'pending') {
                    buttonsDiv.innerHTML = `
                        <button class="btn-confirm" onclick="confirmOrder()">✅ Я оплатил</button>
                        <button class="btn-cancel" onclick="cancelOrder()">❌ Отменить заказ</button>
                    `;
                } else if (order.status === 'awaiting_confirmation') {
                    buttonsDiv.innerHTML = `<p style="color:#2ecc2e;">✅ Заказ подтверждён, ожидает выдачи администратором</p>`;
                } else if (order.status === 'completed') {
                    buttonsDiv.innerHTML = `<p style="color:#2ecc2e;">✅ Заказ выполнен! Привилегии выданы.</p>`;
                } else if (order.status === 'cancelled') {
                    buttonsDiv.innerHTML = `<p style="color:#dc2626;">❌ Заказ отменён</p>`;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('orderInfo').innerHTML = '<p>❌ Ошибка загрузки заказа</p>';
            }
        }
        
        async function confirmOrder() {
            if (!confirm('Подтверждаете оплату? После этого заказ отправится на проверку администратору.')) return;
            
            try {
                const res = await fetch('/api/confirm-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('✅ Заказ подтверждён! Администратор проверит оплату и выдаст привилегию.');
                    loadOrder();
                } else {
                    alert('❌ Ошибка: ' + data.error);
                }
            } catch (error) {
                alert('❌ Ошибка соединения с сервером');
            }
        }
        
        async function cancelOrder() {
            if (!confirm('Отменить заказ?')) return;
            
            try {
                const res = await fetch('/api/cancel-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('✅ Заказ отменён');
                    loadOrder();
                } else {
                    alert('❌ Ошибка: ' + data.error);
                }
            } catch (error) {
                alert('❌ Ошибка соединения с сервером');
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
